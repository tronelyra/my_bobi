<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波比的成长日记 🐾</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <div class="avatar">
                <span class="paw">🐾</span>
            </div>
            <h1>波比的成长日记</h1>
            <p class="subtitle">记录每一天的可爱瞬间</p>
        </div>
    </header>

    <main class="container">
        <section class="card profile-card">
            <h2 class="card-title">👤 基本信息</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">名字</span>
                    <span class="value">波比 (Bobi)</span>
                </div>
                <div class="info-item">
                    <span class="label">生日 🎂</span>
                    <span class="value">2026 年 6 月 12 日</span>
                </div>
                <div class="info-item">
                    <span class="label">到家日期 🏠</span>
                    <span class="value">2026 年 10 月 7 日</span>
                </div>
                <div class="info-item">
                    <span class="label">当前年龄</span>
                    <span class="value" id="age">-</span>
                </div>
                <div class="info-item">
                    <span class="label">到家天数</span>
                    <span class="value" id="days-at-home">-</span>
                </div>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">📈 体重增长曲线</h2>
            <div class="chart-wrapper">
                <canvas id="weightChart"></canvas>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">📋 体重记录</h2>
            <div class="stats-summary">
                <div class="stat">
                    <span class="stat-num" id="initial-weight">-</span>
                    <span class="stat-label">初始体重</span>
                </div>
                <div class="stat">
                    <span class="stat-num" id="current-weight">-</span>
                    <span class="stat-label">最新体重</span>
                </div>
                <div class="stat highlight">
                    <span class="stat-num" id="gain-weight">-</span>
                    <span class="stat-label">总共增长</span>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="weight-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>体重 (kg)</th>
                            <th>增长 (kg)</th>
                        </tr>
                    </thead>
                    <tbody id="weight-tbody"></tbody>
                </table>
            </div>
        </section>

        <section class="card add-card">
            <h2 class="card-title">➕ 添加新记录</h2>
            <form id="add-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">日期</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">体重 (kg)</label>
                        <input type="number" id="weight" step="0.01" min="0" required placeholder="例如 2.15">
                    </div>
                </div>
                <button type="submit" class="btn">保存记录 💾</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>Made with ❤️ for Bobi | 波比，健康快乐成长！</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
